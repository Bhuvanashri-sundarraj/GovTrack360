server:
  port: 8080

spring:
  application:
    name: govtrack360-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/govtrack360}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET:this-is-a-development-only-secret-key-change-it-before-any-real-deployment-1234567890}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  seed:
    # Set SEED_PHASE3_DEMO=false to skip the Phase 3 demo data (reviews, rewards, backfilled attendance).
    phase3-demo-data: ${SEED_PHASE3_DEMO:true}
